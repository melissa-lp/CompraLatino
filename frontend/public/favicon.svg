<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Logo simplificado de CompraLatino: flor de 8 pétalos -->
  <g fill="#111" transform="translate(16 16)">
    <ellipse rx="3" ry="6" transform="rotate(0) translate(0 -8)" />
    <ellipse rx="3" ry="6" transform="rotate(45) translate(0 -8)" />
    <ellipse rx="3" ry="6" transform="rotate(90) translate(0 -8)" />
    <ellipse rx="3" ry="6" transform="rotate(135) translate(0 -8)" />
    <ellipse rx="3" ry="6" transform="rotate(180) translate(0 -8)" />
    <ellipse rx="3" ry="6" transform="rotate(225) translate(0 -8)" />
    <ellipse rx="3" ry="6" transform="rotate(270) translate(0 -8)" />
    <ellipse rx="3" ry="6" transform="rotate(315) translate(0 -8)" />
  </g>
</svg>

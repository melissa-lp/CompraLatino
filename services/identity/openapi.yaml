openapi: 3.0.3
info:
  title: CompraLatino — Servicio de Identidad
  version: 1.0.0
  description: Registro, inicio de sesión y verificación de sesión con JWT.
servers:
  - url: http://localhost:3001

paths:
  /health:
    get:
      summary: Estado del servicio y de la base de datos
      tags: [Sistema]
      responses:
        '200':
          description: Servicio y base de datos funcionando
        '503':
          description: No hay conexión con la base de datos

  /auth/register:
    post:
      summary: Registrar un usuario nuevo
      tags: [Autenticación]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName]
              properties:
                email: { type: string, format: email, example: ana@mail.com }
                password: { type: string, minLength: 8, example: secreta123 }
                fullName: { type: string, example: Ana López }
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Ya existe una cuenta con ese correo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/login:
    post:
      summary: Iniciar sesión y obtener un token JWT
      tags: [Autenticación]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: ana@mail.com }
                password: { type: string, example: secreta123 }
      responses:
        '200':
          description: Credenciales correctas
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: JWT válido por JWT_EXPIRES_IN (1h por defecto) }
                  user: { $ref: '#/components/schemas/User' }
        '400':
          description: Faltan el correo o la contraseña
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Correo o contraseña incorrectos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      summary: Datos del usuario con sesión iniciada
      tags: [Autenticación]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Datos del usuario
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401':
          description: Falta el token o no es válido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: El usuario del token ya no existe
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        fullName: { type: string }
        role: { type: string, enum: [customer, admin] }
        createdAt: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error: { type: string, example: Mensaje del error en español }
